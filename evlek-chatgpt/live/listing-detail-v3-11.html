bp.appendChild(dvEl('span',null,[evlekT(dvRent(d)?'statusRent':'statusSale'),d.roomLabel?evlekRooms(d.roomLabel):dvType(d),dvSpot(d)].filter(Boolean).join(' \u00b7 ')));
bar.appendChild(bp);
var pri=dvPrimaryButton(d,opts.ui);
if(pri)bar.appendChild(pri);
wrap.appendChild(bar);
mount.appendChild(wrap);
if(opts.fixedBar){
var fitBar=function(){if(bar.offsetHeight)wrap.style.paddingBottom=(bar.offsetHeight+12)+'px';};
fitBar();
if(typeof ResizeObserver!=='undefined')new ResizeObserver(fitBar).observe(bar);
}
return wrap;
}
var rootEl=getEl('evlek-root');
var mode='inline';
var lastData=null;
var lastUi=null;
function renderInline(d){
var wrap=dvEl('article','di');
var cover=dvEl('div','di__cover');
var first=d.photos[0];
if(first&&first.url){
var img=createEl('img');
img.src=first.url;
img.loading='eager';
img.setAttribute('decoding','async');
img.width=640;
img.height=360;
img.alt=dvAlt(d,first,0);
evlekImgFallback(img,function(){});
cover.appendChild(img);
}
var total=dvTotal(d);
if(total>1)cover.appendChild(dvEl('span','dv__pos','1 / '+total));
wrap.appendChild(cover);
var bd=dvEl('div','di__bd');
var st=dvEl('div','dv__st');
st.appendChild(dvEl('b',null,'\u25cf '+evlekT(dvRent(d)?'statusRent':'statusSale')));
if(d.listedAt)st.appendChild(document.createTextNode(' \u00b7 '+evlekT('listedOn',{date:evlekFmtDate(d.listedAt)})));
bd.appendChild(st);
bd.appendChild(dvEl('h2','dv__price',dvPrice(d)));
if(dvApprox(d))bd.appendChild(dvEl('div','dv__sub dv__approx',dvApprox(d)));
bd.appendChild(dvFactsLine(d,dvEl('div','dv__facts')));
bd.appendChild(dvEl('div','dv__sub',evlekLocalPlaceText(d)));
wrap.appendChild(bd);
var acts=dvEl('div','di__acts');
var pri=dvPrimaryButton(d,lastUi);
if(pri)acts.appendChild(pri);
var more=createEl('button');
more.type='button';
more.className='evlek-btn--secondary';
more.textContent=total>1?evlekT('photosCount',{n:evlekFmtNum(total,0)}):evlekT('allDetails');
more.addEventListener('click',function(){window.EvlekApp.requestDisplayMode('fullscreen');});
acts.appendChild(more);
wrap.appendChild(acts);
return wrap;
}
function render(){
if(!lastData)return;
dvClear(rootEl);
rootEl.removeAttribute('aria-busy');
if(mode==='fullscreen')evlekDvRender(rootEl,lastData,{fixedBar:true,ui:lastUi});
else if(!fullscreenSupported())evlekDvRender(rootEl,lastData,{fixedBar:false,ui:lastUi});
else rootEl.appendChild(renderInline(lastData));
}
function showStatus(opts){
lastData=null;
dvClear(rootEl);
rootEl.removeAttribute('aria-busy');
var holder=dvEl('div','evlek-error-holder');
rootEl.appendChild(holder);
evlekRenderStatus(holder,opts);
}
function applyHostMode(hc){
var next=hc&&hc.displayMode==='fullscreen'?'fullscreen':'inline';
if(next===mode&&lastData){render();return;}
mode=next;
render();
}
window.EvlekApp.onHostContext(applyHostMode);
window.EvlekApp.onToolResult(function(params){
var sc=params&&params.structuredContent;
if(sc&&sc.locale)evlekUseContentLocale(sc.locale);
var hc=window.EvlekApp.getHostContext&&window.EvlekApp.getHostContext();
mode=hc&&hc.displayMode==='fullscreen'?'fullscreen':'inline';
if(!sc||evlekIsErrorResult(params,sc)){showStatus({message:evlekT('couldNotLoad'),retry:'agent',open:true});return;}
if(sc.found!==true){showStatus({message:evlekT('notFound')});return;}
lastUi=params.evlekUi||null;
lastData=evlekDvNormalize(sc);
render();
});
</script>
</body>
</html>
