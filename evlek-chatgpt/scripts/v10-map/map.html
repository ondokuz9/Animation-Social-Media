<!doctype html><html><head><link rel="stylesheet" href="maplibre-gl.css"><style>html,body,#m{margin:0;width:100%;height:100%;background:#14273B}</style></head>
<body><div id="m"></div><script src="maplibre-gl.js"></script><script>
const q=new URLSearchParams(location.search);
fetch('dark.json').then(r=>r.json()).then(st=>{
 const m=new maplibregl.Map({container:'m',style:st,center:[+q.get('lng'),+q.get('lat')],zoom:+q.get('z'),attributionControl:false,interactive:false,fadeDuration:0,preserveDrawingBuffer:true});
 m.on('idle',()=>{window.done=true});
});
</script></body></html>
